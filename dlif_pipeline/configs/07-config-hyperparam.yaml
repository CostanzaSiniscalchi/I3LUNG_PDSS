task: classification # classification/survival
task_settings:
  outcomes: [ "os_months_6" ]
  loss: mm_loss # mm_survival_loss  mm_loss

training_type: hyperparameter_tuning # hyperparameter_tuning  # cross_validation_stratified
data-type: hypothesis_driven  # hypothesis_driven
source: pyrad  # pyrad 
imp: noimp  # noimp
seed: [0]

use_early_stopping: true
prepare_dataset: true

train_df: [ "../data/features_dataset_radpy_fixed.parquet", "../data/features_dataset_fmrad.parquet" ]
annotation_file: ../data/annotations.csv

mods:
  - cb: true # cb: true
    radfm: true
    dp: true
    genomics: false

 
folds:
  cross_validation:
    - GHD
    - INT
    - MH
    - SZMC
    - VHIO
  standard:
    - ALL

hyperparameters:
  batch_size: [16, 32, 64, 128]  # list needed also for single value
  reconstruction_weight: [0.01, 0.03, 0.1, 0.3]
  n_layers: [1, 2]

# default hyperparameters
hyperparameters_default:
  batch_size: 64
  reconstruction_weight: 0.1
  n_layers: 1

