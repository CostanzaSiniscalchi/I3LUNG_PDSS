task: survival # classification/survival
task_settings:
  outcomes: ["OS_MONTHS"]
  events: DEATH_EVENT_OC # survival only variable
  loss: mm_survival_loss # mm_survival_loss  mm_loss
  save_monitor: c_index  # survival only variable

training_type: standard # hyperparameter_tuning  # cross_validation_stratified
data-type: hypothesis_driven  # hypothesis_driven/data_driven
source: pyrad  # pyrad/foundation
imp: noimp  # noimp/imp
seed: [0]

use_early_stopping: true
prepare_dataset: false

train_df: [ "data/features_dataset_radpy_fixed.parquet", "data/features_dataset_radfm.parquet" ]
annotation_file: data/annotations.csv

mods:
  # - rwd: true # rwd: true
  #   radpy: false
  #   dp: false
  #   genomics: false
  # - rwd: true # rwd: true
  #   radpy: false
  #   dp: true
  #   genomics: false
  # - rwd: true # rwd: true
  #   radpy: true
  #   dp: false
  #   genomics: false
  # - rwd: true # rwd: true
  #   radpy: true
  #   dp: true
  #   genomics: false
  - rwd: true # rwd: true
    radpy: true
    dp: true
    genomics: true
  # - rwd: true # rwd: true
  #   radfm: true
  #   dp: false
  #   genomics: false
  # - rwd: true # rwd: true
  #   radfm: true
  #   dp: true
  #   genomics: false
  # - rwd: true # rwd: true
  #   radfm: true
  #   dp: true
  #   genomics: true
  
folds:
  cross_validation_stratified:
    - GHD_2
    - INT_2
    - MH_2
    - SZMC_2
    - VHIO_2
    - GHD_3
    - INT_3
    - MH_3
    - SZMC_3
    - VHIO_3
  cross_validation:
    - GHD
    - INT
    - MH
    - SZMC
    - VHIO
  standard:
    - ALL

# grid search
hyperparameters:
  batch_size: [16, 32, 64, 128]  # list needed also for single value
  reconstruction_weight: [0.01, 0.03, 0.1, 0.3]
  n_layers: [1, 2]

# default hyperparameters
hyperparameters_default:
  batch_size: 64
  reconstruction_weight: 0.1
  n_layers: 1

